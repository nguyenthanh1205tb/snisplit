name: release

# Push a tag like v0.2.0 to build all binaries and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -count=1 ./...
      - name: Windows resources (icon, manifest, version info)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          go run ./tools/genicon
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64,arm64 \
            --product-version "${VERSION#v}" --file-version "${VERSION#v}"
          ls -la rsrc_windows_*.syso
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/snisplit_${os}_${arch}${ext}" .
          done
          cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Update Scoop manifest
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"; ver="${tag#v}"
          sum() { grep " \*\?$1\$" dist/checksums.txt | cut -d' ' -f1; }
          git fetch -q origin main && git checkout -q main
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          jq --arg v "$ver" --arg b "$base" --arg a "$(sum snisplit_windows_amd64.exe)" --arg r "$(sum snisplit_windows_arm64.exe)" \
            '.version = $v
             | .architecture."64bit".url = "\($b)/snisplit_windows_amd64.exe#/snisplit.exe"
             | .architecture."64bit".hash = $a
             | .architecture.arm64.url = "\($b)/snisplit_windows_arm64.exe#/snisplit.exe"
             | .architecture.arm64.hash = $r' bucket/snisplit.json > m.json
          mv m.json bucket/snisplit.json
          if git diff --quiet; then echo "manifest already at $ver"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "scoop: snisplit $ver"
          git push -q origin main
